name: dropp
description: "DROPP - application mobile (client et vendeur)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # État et navigation
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.1

  # Réseau
  dio: ^5.9.0
  uuid: ^4.5.1

  # Jetons
  flutter_secure_storage: ^11.2.0

  # Modèles (génération de code)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6
  phone_numbers_parser: ^9.0.28
  cached_network_image: ^4.0.5
  video_player: ^2.14.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  socket_io_client: ^3.1.6
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.2
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
